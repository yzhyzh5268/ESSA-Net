# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 5 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n summary: 225 layers,  3157200 parameters,  3157184 gradients,   8.9 GFLOPs
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 225 layers, 11166560 parameters, 11166544 gradients,  28.8 GFLOPs
  m: [0.67, 0.75, 768] # YOLOv8m summary: 295 layers, 25902640 parameters, 25902624 gradients,  79.3 GFLOPs
  l: [1.00, 1.00, 512] # YOLOv8l summary: 365 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPs
  x: [1.00, 1.25, 512] # YOLOv8x summary: 365 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPs

backbone:
  # [from, repeats, module, args]
  # RGB
  - [-1, 1, Conv, [64, 3, 2]]        # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1 - P2/4
  - [-1, 3, C2f, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3 - P3/8

  # IR
  - [-4, 1, Conv, [64, 3, 2]]        # 4
  - [-1, 1, Conv, [128, 3, 2]]       # 5
  - [-1, 3, C2f_Faster, [128, True]] # 6
  - [-1, 1, Conv, [256, 3, 2]]       # 7

  # Fusion1
  - [-3, 1, RIFusion, [64]]          # 8

  # RGB deeper
  - [-4, 6, C2f, [256, True]]        # 9
  - [-1, 1, Conv, [512, 3, 2]]       #10

  # IR deeper
  - [-4, 6, C2f_Faster, [256, True]] #11
  - [-1, 1, Conv, [512, 3, 2]]       #12

  # Fusion2
  - [-3, 1, RIFusion, [128]]         #13

  # RGB deeper
  - [-4, 6, C2f, [512, True]]        #14
  - [-1, 1, Conv, [1024, 3, 2]]      #15

  # IR deeper
  - [-4, 6, C2f_Faster, [512, True]] #16
  - [-1, 1, Conv, [1024, 3, 2]]      #17

  # Fusion3
  - [-3, 1, RIFusion, [256]]         #18

  # RGB top
  - [-4, 3, C2f, [1024, True]]       #19
  - [-1, 1, SPPF, [1024, 5]]         #20

  # IR top
  - [-4, 3, C2f_Faster, [1024, True]]#21
  - [-1, 1, SPPF, [1024, 5]]         #22

  # Fuse corresponding scales (element-wise add)
  - [[9, 11], 1, ADD, [1]]           #23 -> mid-low fused (~256 ch)
  - [[14,16], 1, ADD, [1]]           #24 -> mid fused (~512 ch)
  - [[20,22], 1, ADD, [1]]           #25 -> top fused (~1024 ch)

  # **仅两次新增：**
  # refine mid fused features (after ADD 24)
  - [24, 1, ESSA, [128]]  #26

  # refine top fused features (after ADD 25)
  - [25, 1, ESSA, [256]] #27

head:
  # use the refined top (27) -> upsample and fuse with refined mid (26)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  #28  (upsample from backbone last: 27)
  - [[28, 26], 1, Concat, [1]]                   #29  (concat upsampleed refined-top with refined-mid)
  - [-1, 3, C2f, [512]]                          #30

  # upsample and merge with mid-low fused (23)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  #31
  - [[31, 23], 1, Concat, [1]]                  #32  (concat upsampleed 30 with fused mid-low 23)
  - [-1, 3, C2f, [256]]                         #33

  # downsample path (PAN-like)
  - [-1, 1, Conv, [256, 3, 2]]                   #34
  - [[34, 30], 1, Concat, [1]]                   #35  (concat with earlier 30)
  - [-1, 3, C2f, [512]]                          #36

  - [-1, 1, Conv, [512, 3, 2]]                   #37
  - [[37, 27], 1, Concat, [1]]                   #38  (concat with refined top 27)
  - [-1, 3, C2f, [1024]]                         #39

  # final Detect head: use three detection scales
  - [[33, 36, 39], 1, Detect, [nc]]              #40
